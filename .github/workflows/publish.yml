name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write only to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels a queued older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19   # keep in step with your local `quarto --version`

      # No Python/Jupyter here on purpose: notebooks render from their saved
      # outputs, and executable .qmd code uses committed results in _freeze/.
      - name: Render
        run: quarto render

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
